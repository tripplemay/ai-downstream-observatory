{% extends "base.html" %}
{% block title %}判断与规则 · AI 下游投资观测台{% endblock %}
{% block content %}
<h1>判断与规则</h1>
<form method="post" action="{{ url_for('thesis') }}">
  <div class="panel">
    <h2>核心判断（Thesis）</h2>
    <textarea name="thesis" rows="14">{{ thesis }}</textarea>
  </div>
  <div class="panel">
    <h2>建仓触发规则（Rules）</h2>
    <textarea name="rules" rows="10">{{ rules }}</textarea>
  </div>
  <button type="submit" class="btn btn-primary">保存</button>
</form>
{% endblock %}
