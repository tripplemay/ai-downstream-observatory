services:
  web:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    expose:
      - "5051"

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "worker/scheduler.py"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
