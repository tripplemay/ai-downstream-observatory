services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5051:3000"
    volumes:
      - ./data:/app/data

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "worker/scheduler.py"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
