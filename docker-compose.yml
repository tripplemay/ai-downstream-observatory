services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5051:5051"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "worker/scheduler.py"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
