# deploysvr 宿主 nginx vhost —— etf.vpanel.cc（AI 下游投资观测台）
#
# 链路：用户 → DNS(灰云) → deploysvr 80/443（本 vhost + certbot TLS）→ 127.0.0.1:5051（web 容器）
#
# 安装：
#   cp deploy/nginx/etf.vpanel.cc.conf /etc/nginx/sites-available/
#   ln -sf /etc/nginx/sites-available/etf.vpanel.cc.conf /etc/nginx/sites-enabled/
#   certbot certonly --webroot -w /var/www/certbot -d etf.vpanel.cc
#   nginx -t && systemctl reload nginx

upstream observatory_web {
    server 127.0.0.1:5051;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name etf.vpanel.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name etf.vpanel.cc;

    ssl_certificate     /etc/letsencrypt/live/etf.vpanel.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etf.vpanel.cc/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://observatory_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
